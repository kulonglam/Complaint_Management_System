server:
  port: ${PORT:8000}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: complaint-management-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

app:
  job-secret: ${JOB_SECRET:change-me}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  sla-enabled: ${SLA_JOB_ENABLED:true}
  sla-cron: ${SLA_CRON:0 */15 * * * *}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@localhost}
  rate-limit-capacity: ${RATE_LIMIT_CAPACITY:60}
  rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: INFO
    com.cms.backend: INFO
